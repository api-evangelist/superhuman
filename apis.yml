name: Superhuman
description: >-
  Superhuman is an AI-native productivity platform built around a fast email
  client (Mail), collaborative documents (Docs, formerly Coda), a proactive AI
  assistant (Superhuman Go), the Grammarly writing assistant, Calendar, and
  Databases. Following the combination of Superhuman, Grammarly, and Coda, the
  company operates a developer platform: first-party Model Context Protocol
  (MCP) servers for Mail and Docs that let AI clients such as Claude, ChatGPT,
  and Cursor act on a user's mail and document context; a Superhuman Agents SDK
  and Docs SDK for extending the surface; and REST APIs for Docs, Docs Admin,
  Grammarly, and audit logs. Security posture is published through a SafeBase
  trust center with SOC 2 Type 2 and ISO/IEC 27001/27017/27018/27701
  attestations, and service health is tracked on a public Atlassian status page.
